<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOF98</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; }

#app {
  width:1920px; height:1080px;
  position:absolute;
  background: linear-gradient(160deg, #050020 0%, #180018 45%, #280008 100%);
  font-family:'Malgun Gothic',sans-serif;
  color:#fff;
  user-select:none;
  overflow:hidden;
}
.screen {
  width:1920px; height:1080px;
  display:none; position:absolute; top:0; left:0;
}
.screen.active { display:flex; flex-direction:column; }

/* ══ 화면1: 이름입력 ══ */
#screen-name {
  align-items:center;
  justify-content:flex-end;
  background: url('Title.png') center center / auto 100% no-repeat,
              linear-gradient(160deg, #050020, #280008);
  padding-bottom:90px;
}
#name-input {
  font-size:36px; padding:18px 36px;
  border:3px solid #f0c040;
  background:#111130; color:#fff;
  border-radius:8px; outline:none;
  width:500px; text-align:center;
}
#name-input:focus { border-color:#fff; box-shadow:0 0 16px #f0c040; }
/* 버튼 공통: 5열 그리드, 크기 통일 */
#btn-grid {
  display:flex; flex-direction:column;
  gap:16px; margin-top:36px; align-items:center;
}
.btn-row {
  display:flex; gap:16px;
}
.btn-cell {
  width:240px; height:80px;
  font-size:22px; font-weight:bold;
  border-radius:8px; cursor:pointer;
  border:3px solid #555;
  background:#1a1a3a; color:#aaa;
  transition: all 0.15s;
  line-height:1.35; text-align:center;
  display:flex; align-items:center; justify-content:center;
}
/* 등급 버튼 */
.btn-cell.btn-diff:hover     { border-color:#f0c040; color:#f0c040; }
.btn-cell.btn-diff.selected  { border-color:#f0c040; background:#f0c040; color:#000; }
/* 시작 버튼 */
.btn-cell.btn-start          { background:#f0c040; color:#000; border-color:#f0c040; font-size:28px; }
.btn-cell.btn-start:hover    { background:#ffe080; border-color:#ffe080; }
/* 팀 랜덤 버튼 */
.btn-cell.btn-rand-team      { background:#1a1a3a; color:#aaddff; border-color:#4488cc; }
.btn-cell.btn-rand-team:hover{ background:#223366; border-color:#66aaff; color:#fff; }
/* All 랜덤 버튼 */
.btn-cell.btn-rand-all       { background:#1a1a3a; color:#aaffcc; border-color:#44cc88; }
.btn-cell.btn-rand-all:hover { background:#113322; border-color:#66ffaa; color:#fff; }
/* A등급 래퍼 */
#a-grade-wrap { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; }
/* A등급 점수 선택 팝업: 버튼 위에 표시 */
#a-score-popup {
  display:none;
  position:absolute;
  bottom:calc(100% + 6px); left:50%;
  transform:translateX(-50%);
  background:#111130; border:2px solid #f0c040;
  border-radius:8px; padding:8px 10px;
  z-index:100;
  gap:6px; flex-wrap:wrap;
  width:260px; justify-content:center;
}
#a-score-popup.open { display:flex; }
.a-score-btn {
  width:44px; height:40px;
  font-size:18px; font-weight:bold;
  border:2px solid #555; border-radius:6px;
  background:#1a1a3a; color:#aaa;
  cursor:pointer;
}
.a-score-btn:hover  { background:#333366; border-color:#f0c040; color:#f0c040; }
.a-score-btn.active { background:#f0c040; border-color:#f0c040; color:#000; }

/* 이름 입력 행: 양옆 버튼 */
#name-row {
  display:flex; align-items:center; gap:20px;
}
.btn-side {
  width:180px; height:60px;
  font-size:18px; font-weight:bold;
  border-radius:8px; cursor:pointer;
  border:3px solid #4488cc;
  background:#1a1a3a; color:#aaddff;
  transition:all 0.15s;
}
.btn-side:hover { background:#223366; border-color:#66aaff; color:#fff; }
#btn-dup-toggle {
  border-color:#cc6644; color:#ffaa88;
}
#btn-dup-toggle:hover { background:#331a0a; border-color:#ff8855; color:#fff; }
#btn-dup-toggle.dup-on {
  border-color:#44cc88; color:#aaffcc; background:#0a331a;
}
#btn-dup-toggle.dup-on:hover { background:#113322; border-color:#66ffaa; color:#fff; }

/* ══ 대회 모드 화면 ══ */
#screen-tournament-mode,
#screen-tournament-setup,
#screen-tournament-members,
#screen-tournament-bracket,
#screen-tournament-rand-players,
#screen-tournament-rand-teams {
  background: radial-gradient(ellipse at center, #0a1a2a 0%, #050010 100%);
  flex-direction:column; align-items:center; text-align:center;
}
#screen-tournament-mode        { justify-content:center; gap:40px; padding:70px 350px 40px 350px; }
#screen-tournament-setup       { justify-content:center; gap:26px; padding:50px 350px 40px 350px; }
#screen-tournament-members     { justify-content:center; gap:20px; padding:40px 350px 40px 350px; }
#screen-tournament-bracket     { justify-content:flex-start; padding:14px 0 10px; gap:10px; overflow:hidden; }
#screen-tournament-rand-players{ justify-content:center; gap:18px; padding:70px 350px 40px 40px; }
#screen-tournament-rand-teams  { justify-content:center; gap:22px; padding:50px 350px 40px 40px; }

.tour-title   { font-size:46px; font-weight:bold; color:#f0c040; letter-spacing:4px; text-shadow:0 0 20px #f0c040aa; }
.tour-subtitle{ font-size:20px; color:#aaddff; }

/* 팀 수 선택 */
.tour-count-row { display:flex; align-items:center; gap:14px; font-size:22px; color:#ccc; }
.tour-count-btn {
  width:46px; height:46px; font-size:26px; font-weight:bold;
  border:2px solid #f0c040; background:#1a1a3a; color:#f0c040; border-radius:6px; cursor:pointer;
}
.tour-count-btn:hover { background:#333366; }
.tour-count-btn:disabled { opacity:0.3; cursor:not-allowed; }
.tour-count-val { font-size:34px; font-weight:bold; color:#f0c040; width:52px; text-align:center; }

/* 팀 이름 입력 */
#tour-team-inputs { display:flex; flex-direction:column; gap:9px; width:560px; }
.tour-team-row    { display:flex; align-items:center; gap:10px; }
.tour-team-label  { font-size:17px; color:#aaddff; width:52px; flex-shrink:0; }
.tour-team-input  {
  font-size:19px; padding:9px 14px;
  border:2px solid #4488cc; background:#111130; color:#fff;
  border-radius:6px; outline:none; width:200px;
}
.tour-team-input:focus { border-color:#66aaff; }

/* 팀 컬러 스와치 */
.tour-color-swatches { display:flex; gap:6px; align-items:center; }
.tour-color-swatch {
  width:28px; height:28px; border-radius:50%;
  border:3px solid transparent; cursor:pointer;
  transition:transform 0.1s, border-color 0.1s;
  flex-shrink:0;
}
.tour-color-swatch:hover { transform:scale(1.2); }
.tour-color-swatch.selected { border-color:#fff; transform:scale(1.15); }

/* 규칙 메모 */
.tour-rules-wrap  { display:flex; flex-direction:column; gap:7px; width:540px; }
.tour-rules-label { font-size:15px; color:#f0c04088; }
#tour-rules {
  width:100%; height:84px; resize:none;
  background:#0a0a20; border:2px solid #333366;
  color:#ccc; font-size:15px; padding:8px 12px;
  border-radius:6px; outline:none; font-family:'Malgun Gothic',sans-serif;
}
#tour-rules:focus { border-color:#f0c04066; }

/* 팀원 입력 */
#tour-member-title    { font-size:34px; font-weight:bold; color:#f0c040; }
#tour-member-progress { font-size:19px; color:#aaddff; }
#tour-member-inputs   { display:flex; flex-direction:column; gap:8px; width:380px; max-height:460px; overflow-y:auto; }
.tour-member-row { display:flex; gap:10px; align-items:center; }
.tour-member-input {
  font-size:19px; padding:9px 13px;
  border:2px solid #4488cc; background:#111130; color:#fff;
  border-radius:6px; outline:none; flex:1;
}
.tour-member-input:focus { border-color:#66aaff; }
.tour-member-del {
  width:30px; height:30px; border-radius:50%;
  background:#3a1515; border:none; color:#cc7777; font-size:13px; cursor:pointer;
}
.tour-member-del:hover { background:#5a2020; color:#ff9999; }
#btn-tour-add-member {
  font-size:15px; padding:7px 18px; background:#111130;
  border:2px dashed #4488cc; color:#aaddff; border-radius:6px; cursor:pointer;
  align-self:flex-start;
}
#btn-tour-add-member:hover  { background:#1a2240; }
#btn-tour-add-member:disabled { opacity:0.35; cursor:not-allowed; }

/* 공통 버튼 */
.btn-tour-primary {
  font-size:22px; padding:0 50px; height:52px;
  background:#f0c040; color:#000; border:none; border-radius:8px;
  cursor:pointer; font-weight:bold;
}
.btn-tour-primary:hover { background:#ffe080; }
.btn-tour-secondary {
  font-size:18px; padding:0 24px; height:52px;
  background:#1a1a2a; color:#aaa; border:2px solid #444; border-radius:8px;
  cursor:pointer; font-weight:bold;
}
.btn-tour-secondary:hover { background:#2a2a3a; color:#fff; }

/* 브래킷 */
#bracket-top-bar {
  display:flex; align-items:center; justify-content:space-between;
  width:100%; flex-shrink:0;
  padding:0 16px 0 20px;
  padding-right:300px; /* 사운드 버튼 겹침 방지 */
  box-sizing:border-box;
}
#bracket-title { font-size:28px; font-weight:bold; color:#f0c040; letter-spacing:2px; }

/* 공지사항 전광판 */
#bracket-rules-disp {
  width:1860px; height:52px;
  background:#0a0800; border:2px solid #f0c040;
  border-radius:6px; flex-shrink:0; display:none;
  overflow:hidden; position:relative;
}
#bracket-rules-ticker {
  display:inline-block;
  position:absolute; top:50%; transform:translateY(-50%);
  white-space:nowrap;
  font-size:22px; font-weight:bold; color:#f0c040;
  letter-spacing:2px;
  animation: tickerScroll 22s linear infinite;
}
@keyframes tickerScroll {
  0%   { left:1860px; }
  100% { left:-100%; }
}

/* 브래킷 메인 행 (팀 범례 + 스크롤 영역) */
#bracket-main-row {
  flex:1; display:flex; width:1920px; overflow:hidden;
}
#bracket-team-legend {
  width:180px; flex-shrink:0;
  display:flex; flex-direction:column;
  padding:20px 14px; gap:14px;
  background:#05050f; border-right:1px solid #1a1a2a;
  overflow-y:auto;
}
.legend-team {
  display:flex; align-items:center; gap:10px;
}
.legend-color {
  width:18px; height:18px; border-radius:3px; flex-shrink:0;
  border:1px solid rgba(255,255,255,0.3);
}
.legend-name {
  font-size:15px; font-weight:bold; color:#ccc;
  text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

#bracket-scroll {
  overflow-x:auto; overflow-y:visible;
  flex:1; display:flex;
  align-items:flex-end; padding-bottom:10px;
}
#bracket-canvas-area { position:relative; flex-shrink:0; }

/* 브래킷 박스 */
.bracket-box {
  position:absolute; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:bold; border-radius:5px;
  border:2px solid #1e2a3a; background:#0a0a1e; color:#fff;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px;
  transition:filter 0.15s, opacity 0.15s;
}
.bracket-box-empty   { background:#06060f; border-color:#151520; color:#222; }
.bracket-box-bye     { background:#04040a; border-color:#0e0e18; color:#1a1a28; }
.bracket-box-waiting { background:#08081a; border-color:#1a1a2e; color:#333; }
.bracket-box-active  { border-color:rgba(255,255,255,0.5); cursor:pointer; }
.bracket-box-active:hover { filter:brightness(1.35); border-color:#fff; }
.bracket-box-winner  { border-color:rgba(255,255,255,0.8); }
.bracket-box-loser   { opacity:0.38; filter:grayscale(0.4); }
.bracket-box-champion{ border-color:#f0c040; box-shadow:0 0 16px #f0c04077; font-size:16px; }

#champion-banner {
  font-size:26px; font-weight:bold; color:#f0c040;
  text-shadow:0 0 18px #f0c040bb; display:none;
  letter-spacing:2px; white-space:nowrap;
}

/* 모드 선택 화면 */
#screen-tournament-mode { justify-content:center; gap:50px; }
.mode-btn-row { display:flex; gap:40px; }
.btn-tour-mode {
  width:360px; height:200px;
  font-size:24px; font-weight:bold; line-height:1.5;
  border-radius:14px; cursor:pointer;
  border:3px solid #4488cc; background:#080e1a; color:#aaddff;
  transition:all 0.15s;
}
.btn-tour-mode:hover { background:#142240; border-color:#88bbff; color:#fff; }
.btn-tour-mode.mode-random { border-color:#44cc88; color:#aaffcc; background:#071410; }
.btn-tour-mode.mode-random:hover { background:#0d2a18; border-color:#88ffcc; color:#fff; }
.mode-desc { font-size:15px; color:#aaa; margin-top:10px; }

/* 랜덤 팀 모드 — 참가자 입력 */
#screen-tournament-rand-players { justify-content:center; gap:18px; padding:40px; }
#rand-player-list { display:flex; flex-direction:column; gap:8px; width:420px; max-height:480px; overflow-y:auto; }
.rand-player-row { display:flex; gap:10px; align-items:center; }
.rand-player-input { font-size:19px; padding:9px 13px; border:2px solid #4488cc; background:#111130; color:#fff; border-radius:6px; outline:none; flex:1; }
.rand-player-input:focus { border-color:#66aaff; }
.rand-player-del { width:30px; height:30px; border-radius:50%; background:#3a1515; border:none; color:#cc7777; font-size:13px; cursor:pointer; }
.rand-player-del:hover { background:#5a2020; color:#ff9999; }
#btn-rand-add-player { font-size:15px; padding:7px 18px; background:#111130; border:2px dashed #4488cc; color:#aaddff; border-radius:6px; cursor:pointer; align-self:flex-start; }
#btn-rand-add-player:hover { background:#1a2240; }
#rand-player-count-disp { font-size:16px; color:#aaddff88; }

/* 랜덤 팀 모드 — 팀 설정 */
#screen-tournament-rand-teams { justify-content:center; gap:22px; padding:40px; }
#rand-team-inputs { display:flex; flex-direction:column; gap:9px; width:560px; }

/* 사운드 토글 버튼 */
#btn-sound {
  position:absolute; top:16px; right:16px;
  z-index:200;
  font-size:18px; font-weight:bold;
  padding:8px 18px;
  border:2px solid #f0c040; border-radius:6px;
  background:#111130; color:#f0c040;
  cursor:pointer;
}
#btn-sound:hover { background:#222250; }
#btn-sound.off { border-color:#555; color:#555; background:#0a0a1a; }

/* ══ 화면2: 캐릭터 선택 ══ */
#screen-select {
  background: linear-gradient(160deg, #050020 0%, #180018 45%, #280008 100%);
}

/* 헤더 */
#sel-header {
  height:48px; flex-shrink:0;
  display:flex; align-items:center;
  justify-content:space-between;
  padding:0 50px;
  background:#00000088;
  border-bottom:2px solid #f0c04055;
}
.h-title  { font-size:22px; color:#f0c040; font-weight:bold; letter-spacing:2px; }
.h-team   { font-size:20px; color:#aaddff; }
.h-score  { font-size:20px; }
.h-score span { color:#f0c040; font-size:26px; font-weight:bold; }

/* 그리드 영역 */
#grid-area {
  height:792px; flex-shrink:0;
  position:relative;
  padding:0 60px;
}
#grid-area::before {
  content:'K·O·F';
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-size:220px; font-weight:900;
  color:#ffffff08; letter-spacing:20px;
  pointer-events:none; z-index:0; white-space:nowrap;
}
#char-grid {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  justify-content:space-evenly;
  align-items:center;
  position:relative; z-index:1;
  gap:0;
}
.char-row {
  display:flex;
  justify-content:center;
  gap:18px;
}

/* ── 캐릭터 슬롯 ── */
.char-slot {
  width:118px; height:132px;
  position:relative; cursor:pointer; flex-shrink:0;
}
.char-slot .char-img {
  position:absolute; top:7px; left:0;
  width:118px; height:118px;
  object-fit:contain; object-position:center;
  display:block;
}

/* 셀렉트 프레임 점멸 */
.char-slot .sf {
  position:absolute; top:0; left:0;
  width:118px; height:132px;
  display:none; pointer-events:none; z-index:2;
}
.char-slot .sf1,
.char-slot .sf2 {
  position:absolute; top:0; left:0;
  width:118px; height:132px;
}
.char-slot .sf1 { animation: blink1 0.28s step-end infinite; }
.char-slot .sf2 { animation: blink2 0.28s step-end infinite; }
@keyframes blink1 { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes blink2 { 0%,100%{opacity:0} 50%{opacity:1} }

/* 점수: 왼쪽 하단, 2배 크기, 붙임 */
.char-slot .score-disp {
  position:absolute;
  bottom:0; left:0;
  display:none;
  line-height:0;
  z-index:3;
  font-size:0;
}
.char-slot .score-disp img {
  height:44px; width:auto;
  display:inline-block;
  vertical-align:bottom;
  margin:0; padding:0;
}

/* hover: 프레임 + 점수 */
.char-slot:hover:not(.used):not(.disabled) .sf         { display:block; }
.char-slot:hover:not(.used):not(.disabled) .score-disp { display:block; }
/* selected: 점수만 (금 테두리) */
.char-slot.selected .score-disp { display:block; }
.char-slot.selected .char-img   { outline:3px solid #f0c040; outline-offset:-1px; }
/* selected hover: 프레임 없음 유지 */
.char-slot.selected:hover .sf   { display:none; }

.char-slot.used     { opacity:0.28; cursor:not-allowed; }
.char-slot.disabled { opacity:0.32; cursor:not-allowed; }

/* ══ 하단 팀 영역 ══ */
#team-area {
  flex:1;
  display:flex;
  border-top:2px solid #f0c04044;
  background:#00000055;
}
.team-frame {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:10px 16px; gap:8px;
  border-right:1px solid #ffffff18;
  position:relative;
}
.team-frame:last-child { border-right:none; }
.team-frame.active-tf {
  background:#f0c04010;
  border-top:3px solid #f0c040;
}
.team-frame.done-tf {
  background:#00500010;
  border-top:3px solid #4a8a4a;
}
.tf-top { display:flex; align-items:center; gap:20px; }
.tf-label { font-size:28px; font-weight:bold; color:#f0c040; }
.team-frame.done-tf .tf-label { color:#8fef8f; }
.tf-score { font-size:18px; color:#ccc; }
.tf-score span { color:#f0c040; font-size:22px; font-weight:bold; }
.team-frame.done-tf .tf-score span { color:#8fef8f; }

.tf-slots { display:flex; gap:10px; }
.tf-slot {
  width:110px; height:116px;
  border:2px dashed #444; border-radius:4px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-size:20px; color:#444;
  position:relative; overflow:hidden; flex-shrink:0;
}
.tf-slot.filled      { border-color:#f0c040; }
.tf-slot.filled-done { border-color:#4a8a4a; }
.tf-slot { overflow:visible; }
.tf-slot img.tf-char-img {
  position:absolute; top:0; left:0;
  width:110px; height:110px;
  object-fit:contain; object-position:center; display:block;
}
.tf-slot .tf-score-disp {
  position:absolute; bottom:0; left:0;
  display:flex; gap:0; align-items:flex-end;
  line-height:0; font-size:0; z-index:2;
}
.tf-slot .tf-score-disp img { height:44px; width:auto; display:inline-block; vertical-align:bottom; }
.tf-slot .tf-remove {
  position:absolute; top:2px; right:2px;
  width:18px; height:18px;
  background:#c00; color:#fff;
  border:none; border-radius:50%;
  font-size:11px; cursor:pointer;
  display:none; line-height:18px; text-align:center;
}
.tf-slot:hover .tf-remove { display:block; }

.btn-confirm {
  font-size:17px; padding:8px 22px;
  background:#f0c040; color:#000;
  border:none; border-radius:6px;
  cursor:pointer; font-weight:bold; white-space:nowrap;
}
.btn-confirm:disabled { background:#2a2a2a; color:#555; cursor:not-allowed; }
.btn-confirm.confirmed { background:#4a8a4a; color:#fff; cursor:default; }
.btn-confirm:not(:disabled):not(.confirmed):hover { background:#ffe080; }

/* ══ 화면3: 결과 ══ */
#screen-result {
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, #1a1a3a 0%, #0a0a1a 100%);
  gap:22px; padding:40px 80px;
}
#result-name {
  font-size:48px; color:#f0c040; font-weight:bold;
  text-shadow:0 0 20px #f0c040aa; letter-spacing:4px;
}
.result-team {
  display:flex; align-items:center; gap:24px;
  background:#111130cc; border:2px solid #f0c04066;
  border-radius:12px; padding:16px 40px; width:1000px;
}
.rt-label { font-size:28px; color:#aaddff; width:100px; flex-shrink:0; text-align:center; }
.rt-char  { display:flex; flex-direction:column; align-items:center; gap:6px; }
.rt-char img { width:130px; height:130px; object-fit:cover; border:3px solid #f0c040; border-radius:4px; }
.rt-char span { font-size:17px; color:#fff; }
.rt-plus  { font-size:32px; color:#f0c04077; }
.rt-total { margin-left:auto; font-size:26px; color:#f0c040; font-weight:bold; }
#btn-restart {
  font-size:26px; padding:14px 60px;
  background:#f0c040; color:#000;
  border:none; border-radius:8px;
  cursor:pointer; font-weight:bold;
}
#btn-restart:hover { background:#ffe080; }
#btn-save {
  font-size:26px; padding:14px 60px;
  background:#4488cc; color:#fff;
  border:none; border-radius:8px;
  cursor:pointer; font-weight:bold;
}
#btn-save:hover { background:#66aaff; }
#result-buttons { display:flex; gap:24px; }

/* 팀원 팝업 */
#team-member-popup {
  display:none; position:fixed; z-index:9999;
  background:#0d1a2e; border:2px solid #f0c040;
  border-radius:10px; padding:18px 24px; min-width:180px;
  box-shadow:0 0 24px #f0c04066;
  pointer-events:auto;
}
#team-member-popup .pop-title {
  font-size:17px; font-weight:bold; color:#f0c040;
  margin-bottom:10px; border-bottom:1px solid #f0c04044; padding-bottom:6px;
}
#team-member-popup .pop-member {
  font-size:15px; color:#ddeeff; padding:3px 0;
}

  app.style.transformOrigin = 'center center';
  app.style.left = '50%';
  app.style.top  = '50%';

window.addEventListener('load',   fitScreen);
window.addEventListener('resize', fitScreen);

// ── BGM / SFX ──
const bgmMap = {
  'screen-name':                      document.getElementById('bgm-title'),

  'screen-tournament-mode':           document.getElementById('bgm-contest'),

  'screen-tournament-bracket':        document.getElementById('bgm-contest'),
};

const sfxCha    = document.getElementById('sfx-cha');
const sfxTeam   = document.getElementById('sfx-team');
const sfxWinner = document.getElementById('sfx-winner');

let currentBGM = null;
let soundOn = true;

function playBGM(sid) {
  const next = bgmMap[sid];
  if (currentBGM && currentBGM !== next) { currentBGM.pause(); currentBGM.currentTime = 0; }
  if (next && next !== currentBGM) {
    currentBGM = next;
    if (soundOn) { next.currentTime = 0; next.play().catch(()=>{}); }
  }
}

function playSFX(el) {
  if (!soundOn) return;
  el.currentTime = 0;
  el.play().catch(()=>{});
}

// ── 사운드 토글 ──
const btnSound = document.getElementById('btn-sound');
btnSound.addEventListener('click', (e) => {
  e.stopPropagation();
  soundOn = !soundOn;
  btnSound.textContent = soundOn ? '🔊 Sound ON' : '🔇 Sound OFF';
  btnSound.classList.toggle('off', !soundOn);
  if (soundOn) {
    // 현재 화면 BGM 재개
    if (currentBGM) { currentBGM.currentTime = 0; currentBGM.play().catch(()=>{}); }
  } else {
    // 모든 오디오 정지
    if (currentBGM) currentBGM.pause();
  }
});
document.addEventListener('click', () => { if (!currentBGM) playBGM('screen-name'); }, {once:true});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  playBGM(id);
}

// ── 점수 이미지 HTML ──
function scoreHTML(score) {
  return String(score).split('').map(d => `<img src="number/0${d}.png">`).join('');
}

// ── 호버 사운드 딜레이 ──
let hoverCooldown = false;
function playHoverSFX() {
  if (hoverCooldown) return;
  playSFX(sfxHover);
  hoverCooldown = true;
  setTimeout(() => { hoverCooldown = false; }, 120);
}

// ── 그리드 구성 ──
function buildGrid() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  const allChars = [...CHARS_RAW, RANDOM_CHAR]; // 51개
  const PER_ROW = 14;
  for (let r = 0; r < 4; r++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'char-row';
    const slice = allChars.slice(r * PER_ROW, r * PER_ROW + PER_ROW);
    slice.forEach(char => {
      const slot = document.createElement('div');
      slot.className = 'char-slot';
      slot.dataset.name = char.name;
      slot.title = `${char.name} (${char.score}점)`;
      slot.innerHTML = `
        <img class="char-img" src="${IMG_BASE}${char.file}" alt="${char.name}">
        <div class="sf">
          <img class="sf1" src="select1.png">
          <img class="sf2" src="select2.png">
        </div>
        <div class="score-disp">${scoreHTML(char.score)}</div>
      `;
      slot.addEventListener('mouseenter', () => {
        if (!slot.classList.contains('used') && !slot.classList.contains('disabled')) {
          playHoverSFX();
        }
      });
      slot.addEventListener('click', () => toggleChar(char, slot));
      rowDiv.appendChild(slot);
    });
    grid.appendChild(rowDiv);
  }
}

// ── currentScore ──
function currentScore(ti) {
  return currentPick[ti].reduce((s,c) => s + c.score, 0);
}

// ── 베이스 이름 (EX/각성 제거) ──
function baseName(name) {
  return name.replace(/^(EX|각성)/, '');
}

// ── 랜덤 3명 뽑기 ──
function pickRandom(ti) {
  const available = CHARS_RAW.filter(c => !usedNames.has(c.name));
  for (let attempt = 0; attempt < 300; attempt++) {
    const shuffled = [...available].sort(() => Math.random() - 0.5);
    const pick = [];
    let total = 0;
    for (const c of shuffled) {
      if (pick.length === TEAM_SIZE) break;
      if (total + c.score > MAX_SCORE) continue;
      // 같은 팀 내 베이스 이름 중복 제외
      if (pick.some(p => baseName(p.name) === baseName(c.name))) continue;
      pick.push(c);
      total += c.score;
    }
    if (pick.length === TEAM_SIZE) return pick;
  }
  return null;
}

// ── 캐릭터 토글 ──
function toggleChar(char, el) {
  if (el.classList.contains('used') || el.classList.contains('disabled')) return;
  const ti = activeTeam;
  const picks = currentPick[ti];

  if (char.isRandom) {
    // 이미 랜덤으로 채워진 상태면 취소
    if (picks.length === TEAM_SIZE && picks._isRandom) {
      currentPick[ti] = [];
      currentPick[ti]._isRandom = false;
    } else {
      const result = pickRandom(ti);
      if (!result) { alert('조합 가능한 캐릭터가 없습니다.'); return; }
      currentPick[ti] = result;
      currentPick[ti]._isRandom = true;
      playSFX(sfxCha);
    }
    updateUI(); return;
  }

  // 랜덤으로 채워진 상태면 일반 클릭 무시
  if (picks._isRandom) return;

  const idx = picks.findIndex(c => c.name === char.name);
  if (idx !== -1) {
    picks.splice(idx, 1);
  } else {
    if (picks.length >= TEAM_SIZE) return;
    if (currentScore(ti) + char.score > MAX_SCORE) return;
    // 같은 팀 내 베이스 이름 중복 방지
    if (picks.some(p => baseName(p.name) === baseName(char.name))) return;
    picks.push(char);
    playSFX(sfxCha);
  }
  updateUI();
}

// ── 슬롯 제거 ──
function removeSlot(ti, si) {
  if (ti !== activeTeam) return;
  const picks = currentPick[ti];
  if (!picks[si]) return;
  // 랜덤으로 채워진 경우 전체 초기화
  if (picks._isRandom) {
    currentPick[ti] = [];
    currentPick[ti]._isRandom = false;
  } else {
    picks.splice(si, 1);
  }
  updateUI();
}

// ── 팀 확정 ──
function confirmTeam(ti) {
  if (ti !== activeTeam) return;
  const picks = currentPick[ti];
  if (picks.length < TEAM_SIZE) return;
  teams[ti] = [...picks];
  picks.forEach(c => usedNames.add(c.name));
  playSFX(sfxTeam);
  const next = teams.findIndex((t,i) => t === null && i > ti);
  if (next !== -1) { activeTeam = next; updateUI(); }
  else showResult();
}

// ── UI 전체 갱신 ──
function updateUI() {
  const ti = activeTeam;
  document.getElementById('h-team-ind').textContent = `팀 ${ti+1} 선택 중`;
  document.getElementById('h-score-max').textContent = MAX_SCORE;
  document.getElementById('h-score-val').textContent = MAX_SCORE - currentScore(ti);
  document.querySelectorAll('.tf-score-max').forEach(el => {
    el.textContent = MAX_SCORE;
  });

  for (let t = 0; t < 3; t++) {
    const tf  = document.getElementById(`tf-${t}`);
    const btn = document.getElementById(`btn-c-${t}`);
    tf.classList.remove('active-tf','done-tf');

    if (teams[t] !== null) {
      tf.classList.add('done-tf');
      btn.textContent = '확정됨'; btn.classList.add('confirmed'); btn.disabled = true;
      const sc = teams[t].reduce((s,c)=>s+c.score,0);
      document.getElementById(`tf-score-${t}`).textContent = sc;
      renderTSlots(t, teams[t], true);
    } else if (t === activeTeam) {
      tf.classList.add('active-tf');
      btn.classList.remove('confirmed'); btn.textContent = '팀 확정';
      btn.disabled = currentPick[t].length < TEAM_SIZE;
      document.getElementById(`tf-score-${t}`).textContent = currentScore(t);
      renderTSlots(t, currentPick[t], false);
    } else {
      btn.classList.remove('confirmed'); btn.textContent = '팀 확정'; btn.disabled = true;
      document.getElementById(`tf-score-${t}`).textContent = 0;
      renderTSlots(t, [], false);
    }
  }

  const picks        = currentPick[activeTeam];
  const isRandomPicked = !!picks._isRandom;
  const pickedNow    = new Set(picks.map(c => c.name));
  const scoreNow     = currentScore(activeTeam);

  document.querySelectorAll('.char-slot').forEach(el => {
    const name = el.dataset.name;
    const char = CHARS.find(c => c.name === name);
    el.classList.remove('selected','used','disabled');
    if (char.isRandom) {
      if (isRandomPicked) el.classList.add('selected');
    } else if (usedNames.has(name)) {
      el.classList.add('used');
    } else if (isRandomPicked) {
      el.classList.add('disabled');
    } else if (pickedNow.has(name)) {
      el.classList.add('selected');
    } else if (picks.length < TEAM_SIZE && (
      scoreNow + char.score > MAX_SCORE ||
      picks.some(p => baseName(p.name) === baseName(char.name))
    )) {
      el.classList.add('disabled');
    }
  });
}

function renderTSlots(ti, picks, done) {
  for (let si = 0; si < TEAM_SIZE; si++) {
    const slot = document.getElementById(`ts-${ti}-${si}`);
    const char = picks[si];
    slot.classList.remove('filled','filled-done');
    if (char) {
      slot.classList.add(done ? 'filled-done' : 'filled');
      slot.innerHTML = `
        <img class="tf-char-img" src="${IMG_BASE}${char.file}" alt="${char.name}">
        <div class="tf-score-disp">${scoreHTML(char.score)}</div>
        ${done ? '' : `<button class="tf-remove" onclick="removeSlot(${ti},${si})">✕</button>`}
      `;
    } else {
      slot.innerHTML = `<span>?</span>`;
    }
  }
}

// ── 팀 랜덤 (12팀 리스트 기반) ──
function pickTeamRandom(includeVariants) {
  const v = document.getElementById('name-input').value.trim();
  if (!v) { alert('이름을 입력해주세요.'); return; }
  playerName = v;

  // 12팀 중 3팀 랜덤 선택
  const shuffled = [...TEAMS_12].sort(() => Math.random() - 0.5);
  const picked3 = shuffled.slice(0, 3);

  teams = picked3.map(teamNames =>
    teamNames.map(name => {
      if (includeVariants) {
        // 오리지널 + 각성/EX 버전 중 랜덤 선택
        const options = CHARS_RAW.filter(c => baseName(c.name) === name);
        return options[Math.floor(Math.random() * options.length)];
      } else {
        // 오리지널만
        return CHARS_RAW.find(c => c.name === name);
      }
    }).filter(Boolean)
  );

  usedNames = new Set(teams.flat().map(c => c.name));
  showResult();
}

// ── All 랜덤 (팀/점수 무관, 3팀 9명 랜덤) ──
function pickAllRandom(includeVariants) {
  const v = document.getElementById('name-input').value.trim();
  if (!v) { alert('이름을 입력해주세요.'); return; }
  playerName = v;

  const pool = includeVariants
    ? [...CHARS_RAW]
    : CHARS_RAW.filter(c => !/^(각성|EX)/.test(c.name));

  for (let attempt = 0; attempt < 500; attempt++) {
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    const used = new Set();
    const result = [];
    let ok = true;

    for (let t = 0; t < 3; t++) {
      const team = [];
      for (const c of shuffled) {
        if (team.length === TEAM_SIZE) break;
        if (used.has(c.name)) continue;
        if (team.some(p => baseName(p.name) === baseName(c.name))) continue;
        team.push(c);
      }
      if (team.length < TEAM_SIZE) { ok = false; break; }
      team.forEach(c => used.add(c.name));
      result.push(team);
    }

    if (ok) {
      teams = result;
      usedNames = used;
      showResult();
      return;
    }
  }
  alert('조합 가능한 팀을 찾지 못했습니다.');
}

    const byePlayer = (allMembers.length%2===1) ? allMembers[allMembers.length-1] : null;
    startTournament(byePlayer);
  } else {
    showMemberInput(tourMemberIdx+1);
  }
});

// ── 시드 배치 (같은 팀 1라운드 대전 회피, byePlayer는 BYE 슬롯에 배치) ──
function seedPlayers(byePlayer=null){
  const all = tourTeams.flatMap((t,ti)=> t.members.map(m=>({name:m,team:ti})));
  const n   = all.length;
  const slots = nextPow2(n);
  const hasBye = n < slots;

  // byePlayer를 분리
  let byeEntry = null;
  let seedable = all;
  if(byePlayer && hasBye){
    byeEntry = all.find(p=>p.name===byePlayer);
    seedable  = all.filter(p=>p.name!==byePlayer);
  }

  // 300번 시도: 인접 쌍에 같은 팀 없도록 (byePlayer 제외 멤버로)
  for(let attempt=0;attempt<300;attempt++){
    const shuffled=[...seedable].sort(()=>Math.random()-0.5);
    // byePlayer는 맨 뒤에 배치 → 마지막 null과 쌍을 이뤄 부전승
    if(byeEntry) shuffled.push(byeEntry);
    while(shuffled.length<slots) shuffled.push({name:null,team:-1});
    let ok=true;
    const checkLimit = byeEntry ? slots-2 : slots; // byePlayer 쌍만 제외
    for(let i=0;i<checkLimit;i+=2){
      if(shuffled[i].team>=0&&shuffled[i+1].team>=0&&shuffled[i].team===shuffled[i+1].team){
        ok=false; break;
      }
    }
    if(ok) return shuffled.map(p=>p.name);
  }
  // 폴백: posStep=1로 모든 슬롯 순서대로 배치
  // byeEntry 있을 때는 slots-2 이전까지만 seedable 배치, 마지막에서 두번째에 byeEntry 삽입
  const result=new Array(slots).fill(null);
  let pos=0;
  const fallbackLimit = byeEntry ? slots-2 : slots;
  seedable.forEach(p=>{
    while(pos<fallbackLimit&&result[pos]!==null) pos++;
    if(pos<fallbackLimit){ result[pos]=p.name; pos++; }
  });
  if(byeEntry) result[slots-2]=byeEntry.name;
  return result;
}

// ── BYE 슬롯 영구 판별 (해당 위치를 채울 round-0 시드가 전부 null) ──
function isPermNull(r, i){
  if(r===0) return bracketGrid[0][i]===null;
  const stride=1<<r;
  const start=i*stride, end=Math.min(start+stride, bracketGrid[0].length);
  for(let j=start;j<end;j++) if(bracketGrid[0][j]!==null) return false;
  return true;
}

// ── BYE 연쇄 진출 (영구 BYE 슬롯 상대방이면 자동 진출) ──
function cascadeByes(){
  let changed=true;
  while(changed){
    changed=false;
    for(let r=0;r<bracketNumRows-1;r++){
      for(let i=0;i<bracketGrid[r].length;i+=2){
        const a=bracketGrid[r][i], b=bracketGrid[r][i+1];
        const ni=i>>1;
        if(bracketGrid[r+1]?.[ni]) continue;
        if(a && !b && isPermNull(r,i+1)){ bracketGrid[r+1][ni]=a; changed=true; }
        else if(!a && b && isPermNull(r,i)){ bracketGrid[r+1][ni]=b; changed=true; }
      }
    }
  }
}

// ── 브래킷 초기화 ──
function initBracket(seeds){
  bracketSlots   = seeds.length;
  bracketNumRows = Math.log2(bracketSlots)+1;
  bracketGrid    = [];
  for(let r=0;r<bracketNumRows;r++){
    bracketGrid.push(new Array(bracketSlots>>r).fill(null));
  }
  bracketGrid[0] = [...seeds];
  cascadeByes(); // BYE 연쇄 처리 (홀수 참가자 지원)
}

// ── 브래킷 렌더링 (하단→상단) ──
function renderBracketView(){
  const area = document.getElementById('bracket-canvas-area');
  area.innerHTML='';

  const BH   = 44;
  const CHAMP_SCALE = 2;  // 우승자 박스 배율
  const topPad = BH * CHAMP_SCALE; // 우승 박스 공간 확보
  const VGAP  = Math.min(140, Math.max(72, Math.floor((700 - bracketNumRows*BH) / Math.max(1,bracketNumRows-1))));
  const slotW0 = Math.max(130, Math.floor(1760/bracketSlots));
  const BW    = slotW0 - 10;
  const containerW = slotW0 * bracketSlots;
  const containerH = bracketNumRows*(BH+VGAP) - VGAP + 30 + topPad;

  area.style.width  = containerW+'px';
  area.style.height = containerH+'px';

  // 좌표 헬퍼 (topPad로 모든 행 아래로 이동)
  function rowY(r){ return containerH - BH - r*(BH+VGAP) - topPad; }
  function cxOf(r,i){
    const sw = containerW / (bracketSlots>>r);
    return sw*i + sw/2;
  }

  // SVG
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width', containerW);
  svg.setAttribute('height', containerH);
  svg.style.cssText='position:absolute;top:0;left:0;pointer-events:none;overflow:visible;';
  area.appendChild(svg);

  // ── 선 그리기 ──
  for(let r=0;r<bracketNumRows-1;r++){
    const cnt       = bracketSlots>>r;
    const neonColor = ROUND_LINE_COLORS[Math.min(r, ROUND_LINE_COLORS.length-1)];
    for(let i=0;i<cnt;i+=2){
      const x1=cxOf(r,i), x2=cxOf(r,i+1), xp=cxOf(r+1,i>>1);
      const childTop  = rowY(r);
      // 우승 행이면 champion 박스가 2× 크기: 부모 박스 하단 계산
      const isChampParent = (r+1 === bracketNumRows-1);
      const pBH = isChampParent ? BH*CHAMP_SCALE : BH;
      const pBy = isChampParent
        ? rowY(r+1) - BH*(CHAMP_SCALE-1)   // 2× 박스는 위쪽으로 더 올라감
        : rowY(r+1);
      const parentBot = pBy + pBH;
      const midY = Math.round((childTop + parentBot) / 2);

      // 기본 흰색 선 (4개 세그먼트: 좌수직 + 우수직 + 수평 + 부모수직)
      const fullPath =
        `M${x1},${childTop} V${midY} ` +
        `M${x2},${childTop} V${midY} ` +
        `M${x1},${midY} H${x2} ` +
        `M${xp},${midY} V${parentBot}`;
      const baseLine = document.createElementNS('http://www.w3.org/2000/svg','path');
      baseLine.setAttribute('d', fullPath);
      baseLine.setAttribute('stroke','rgba(255,255,255,0.4)');
      baseLine.setAttribute('stroke-width','1.5');
      baseLine.setAttribute('fill','none');
      svg.appendChild(baseLine);

      // 승자 네온 선 (연속 경로: 승자 위치 → midY → 수평 → 부모)
      const winner = bracketGrid[r+1]?.[i>>1];
      if(winner){
        const wSrc = (bracketGrid[r][i]===winner) ? i : i+1;
        const wx   = cxOf(r, wSrc);
        // 하나의 연속 경로: wx,childTop → wx,midY → xp,midY → xp,parentBot
        const winPath = `M${wx},${childTop} V${midY} H${xp} V${parentBot}`;

        // 글로우 (외각)
        const glow = document.createElementNS('http://www.w3.org/2000/svg','path');
        glow.setAttribute('d', winPath);
        glow.setAttribute('stroke', neonColor);
        glow.setAttribute('stroke-width','8');
        glow.setAttribute('stroke-opacity','0.3');
        glow.setAttribute('fill','none');
        glow.setAttribute('stroke-linecap','round');
        glow.setAttribute('stroke-linejoin','round');
        svg.appendChild(glow);

        // 코어
        const core = document.createElementNS('http://www.w3.org/2000/svg','path');
        core.setAttribute('d', winPath);
        core.setAttribute('stroke', neonColor);
        core.setAttribute('stroke-width','2.5');
        core.setAttribute('fill','none');
        core.setAttribute('stroke-linecap','round');
        core.setAttribute('stroke-linejoin','round');
        svg.appendChild(core);
      }
    }
  }

  // 라운드 레이블
  const matchRounds = bracketNumRows-1;
  const RLABELS = (()=>{
    if(matchRounds===1) return ['결승','우승'];
    if(matchRounds===2) return ['준결승','결승','우승'];
    if(matchRounds===3) return ['8강','4강','결승','우승'];
    if(matchRounds===4) return ['16강','8강','4강','결승','우승'];
    return Array.from({length:matchRounds},(_,i)=>`${matchRounds-i}라운드`).concat(['우승']);
  })();

  // ── 박스 렌더링 ──
  for(let r=0;r<bracketNumRows;r++){
    const row=bracketGrid[r];
    const isChampRow=(r===bracketNumRows-1);
    for(let i=0;i<row.length;i++){
      const player=row[i];
      const teamIdx  = player!=null ? playerTeamMap[player] : -1;
      const teamColor= (teamIdx>=0) ? tourTeams[teamIdx].color : null;

      // 상태
      let stateCls='';
      let clickable=false;
      if(isChampRow){
        stateCls = player ? 'bracket-box-champion' : 'bracket-box-empty';
      } else if(r===0 && !player){
        stateCls='bracket-box-bye';
      } else if(!player){
        stateCls='bracket-box-empty';
      } else {
        const adv=bracketGrid[r+1]?.[i>>1];
        if(adv===player)       stateCls='bracket-box-winner';
        else if(adv)           stateCls='bracket-box-loser';
        else if(row[i^1]!==null){ stateCls='bracket-box-active'; clickable=true; }
        else                   stateCls='bracket-box-waiting';
      }

      // 우승 박스: 2× 크기, 위쪽으로 확장
      const boxW = isChampRow ? BW*CHAMP_SCALE : BW;
      const boxH = isChampRow ? BH*CHAMP_SCALE : BH;
      const bx   = cxOf(r,i) - boxW/2;
      const by   = isChampRow ? rowY(r) - BH*(CHAMP_SCALE-1) : rowY(r);

      // 배경색 결정
      let bgStyle='';
      if(teamColor){
        const alpha = stateCls==='bracket-box-loser' ? '0.38' : '1';
        bgStyle=`background:${teamColor};border-color:rgba(255,255,255,${stateCls==='bracket-box-loser'?'0.15':'0.5'});color:#fff;opacity:${alpha};`;
      }
      const champBorder = isChampRow && player ? 'box-shadow:0 0 20px #f0c04099,0 0 40px #f0c04044;' : '';
      const fontSize = isChampRow ? `font-size:28px;` : '';

      const box=document.createElement('div');
      box.className=`bracket-box ${stateCls}`;
      box.style.cssText=`left:${bx}px;top:${by}px;width:${boxW}px;height:${boxH}px;${bgStyle}${champBorder}${fontSize}`;
      box.textContent = player || '';

      // 우승자 이름표 바로 위에 🏆 배너
      if(isChampRow && player){
        const champLbl=document.createElement('div');
        champLbl.style.cssText=`position:absolute;left:${bx}px;top:${by-60}px;width:${boxW}px;`
          +`text-align:center;font-size:35px;font-weight:bold;color:#f0c040;`
          +`text-shadow:0 0 12px #f0c040aa;white-space:nowrap;pointer-events:none;`;
        champLbl.textContent=`🏆 우승: ${player} 🏆`;
        area.appendChild(champLbl);
      }

      // 라운드 레이블
      if(i===0 && RLABELS[r]){
        const lbl=document.createElement('span');
        lbl.style.cssText='position:absolute;left:0;top:-17px;font-size:11px;color:#f0c04077;white-space:nowrap;pointer-events:none;';
        lbl.textContent=RLABELS[r];
        box.appendChild(lbl);
      }

      if(clickable) box.addEventListener('click',()=>advanceBracketPlayer(r,i));
      area.appendChild(box);
    }
  }

  // 우승 배너 (상단 바 숨김 — 캔버스 위에 직접 표시)
  document.getElementById('champion-banner').style.display='none';
}

function advanceBracketPlayer(r,i){
  const player=bracketGrid[r][i];
  if(!player) return;
  const nr=r+1, ni=i>>1;
  if(nr>=bracketNumRows || bracketGrid[nr][ni]) return;
  bracketGrid[nr][ni]=player;
  cascadeByes();
  renderBracketView();
  if(nr===bracketNumRows-1){
    playSFX(sfxWinner);
    launchConfetti();
  }
}

// ── 꽃가루 효과 ──
function launchConfetti(){
  const existing=document.getElementById('confetti-canvas');
  if(existing) existing.remove();
  const canvas=document.createElement('canvas');
  canvas.id='confetti-canvas';
  canvas.width=1920; canvas.height=1080;
  canvas.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:500;';
  document.getElementById('app').appendChild(canvas);
  const ctx=canvas.getContext('2d');

  const COLORS=['#f0c040','#ff4466','#00ff88','#0099ff','#ff88ff','#ffffff','#ffaa00','#44ffff'];
  const particles=[];
  for(let i=0;i<200;i++){
    particles.push({
      x: Math.random()*1920,
      y: -20 - Math.random()*300,
      vx:(Math.random()-0.5)*5,
      vy: Math.random()*4+2,
      vrot:(Math.random()-0.5)*8,
      rot: Math.random()*360,
      w:  Math.random()*14+6,
      h:  Math.random()*7+4,
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
    });
  }

  let frame=0;
  const maxFrames=300;
  function tick(){
    ctx.clearRect(0,0,1920,1080);
    const progress=frame/maxFrames;
    particles.forEach(p=>{
      p.x  += p.vx;
      p.y  += p.vy;
      p.rot+= p.vrot;
      p.vy += 0.06;  // 중력
      p.vx *= 0.995; // 공기 저항
      const alpha = frame<200 ? 1 : 1-(progress-200/maxFrames)/(100/maxFrames);
      ctx.save();
      ctx.globalAlpha=Math.max(0, alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    frame++;
    if(frame<maxFrames) requestAnimationFrame(tick);
    else canvas.remove();
  }
  tick();
}

function startTournament(byePlayer=null){
  playerTeamMap={};
  tourTeams.forEach((t,ti)=> t.members.forEach(m=>{ playerTeamMap[m]=ti; }));

  const seeds=seedPlayers(byePlayer);
  initBracket(seeds);

  // 전광판 공지사항
  let rulesText=tourRules||'';
  if(byePlayer) rulesText=(rulesText ? rulesText+'     ※ 부전승: '+byePlayer : '※ 부전승: '+byePlayer);
  const rulesEl=document.getElementById('bracket-rules-disp');
  const ticker =document.getElementById('bracket-rules-ticker');
  if(rulesText){
    ticker.textContent=rulesText;
    rulesEl.style.display='block';
    // 텍스트 길이에 따라 스크롤 속도 조정
    const speed=Math.max(80, rulesText.length*2.5);
    ticker.style.animationDuration=speed+'s';
  } else {
    rulesEl.style.display='none';
  }

  document.getElementById('champion-banner').style.display='none';
  renderTeamLegend();
  showScreen('screen-tournament-bracket');
  requestAnimationFrame(()=> renderBracketView());
}

document.getElementById('btn-tour-bracket-back').addEventListener('click',()=>{
  if(tourMode==='random'){
    renderRandTeamInputs(); showScreen('screen-tournament-rand-teams');
  } else {
    showMemberInput(tourTeams.length-1);
  }
});
document.getElementById('btn-tour-bracket-home').addEventListener('click',()=> showScreen('screen-name'));

// ── 브래킷 이미지 저장 ──
document.getElementById('btn-tour-bracket-save').addEventListener('click', ()=>{
  const app = document.getElementById('app');
  // 캡처 전 scale 제거 → 1920×1080 원본 크기로 캡처
  const savedTransform = app.style.transform;
  const savedLeft      = app.style.left;
  const savedTop       = app.style.top;
  app.style.transform  = 'none';
  app.style.left       = '0';
  app.style.top        = '0';
  html2canvas(app, { backgroundColor:'#050010', scale:1, useCORS:true, width:1920, height:1080 }).then(canvas=>{
    // 복원
    app.style.transform = savedTransform;
    app.style.left      = savedLeft;
    app.style.top       = savedTop;
    const a = document.createElement('a');
    a.download = `tournament_${Date.now()}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
});

// ── 팀원 팝업 ──
const teamPopup    = document.getElementById('team-member-popup');
const popTeamName  = document.getElementById('pop-team-name');
const popMemberList= document.getElementById('pop-member-list');

function showTeamPopup(t, e){
  popTeamName.textContent = t.name;
  popMemberList.innerHTML = t.members.map(m=>`<div class="pop-member">· ${m}</div>`).join('');
  // 팝업 위치: 클릭 위치 기준
  const x = e.clientX + 14, y = e.clientY + 14;
  teamPopup.style.left = Math.min(x, window.innerWidth-220)+'px';
  teamPopup.style.top  = Math.min(y, window.innerHeight-200)+'px';
  teamPopup.style.display = 'block';
}
document.addEventListener('click', e=>{
  if(!teamPopup.contains(e.target)) teamPopup.style.display='none';
});

// renderTeamLegend 오버라이드: 클릭 이벤트 추가
const _origRenderTeamLegend = renderTeamLegend;
renderTeamLegend = function(){
  _origRenderTeamLegend();
  const el = document.getElementById('bracket-team-legend');
  el.querySelectorAll('.legend-team').forEach((row, idx)=>{
    row.style.cursor = 'pointer';
    row.addEventListener('click', e=>{ e.stopPropagation(); showTeamPopup(tourTeams[idx], e); });
  });
};
</script>
</body>
</html>
